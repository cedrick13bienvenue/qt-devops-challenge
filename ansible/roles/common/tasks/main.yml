- name: Read free space in the root volume group
  ansible.builtin.command: vgs --noheadings --nosuffix --units m -o vg_free {{ common_root_vg }}
  register: common_vg_free
  changed_when: false

- name: Grow the root logical volume and its filesystem into all free space
  ansible.builtin.command: lvextend --resizefs -l +100%FREE /dev/{{ common_root_vg }}/{{ common_root_lv }}
  when: (common_vg_free.stdout | trim | float) > common_min_free_mb

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable sysstat data collection
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
  notify: Restart sysstat

- name: Ensure sysstat is running
  ansible.builtin.service:
    name: sysstat
    state: started
    enabled: true
