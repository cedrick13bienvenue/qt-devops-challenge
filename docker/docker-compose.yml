name: projecthub

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - web
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USER}/projecthub-frontend:${TAG}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - web
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_USER}/projecthub-api:${TAG}
    environment:
      PORT: "8080"
      GIN_MODE: release
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      MONGO_DB: projecthub
      JWT_SECRET: ${JWT_SECRET}
      CACHE_ENABLED: "true"
      VALKEY_ADDR: valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      SEED_ENABLED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - web
      - data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - data
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  web:
  data:
    internal: true
