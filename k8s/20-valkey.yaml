apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/part-of: projecthub
    app: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: projecthub
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          command:
            - sh
            - -c
            - exec valkey-server --requirepass "$VALKEY_PASSWORD" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: projecthub-secret
                  key: VALKEY_PASSWORD
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/part-of: projecthub
    app: valkey
spec:
  selector:
    app: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
