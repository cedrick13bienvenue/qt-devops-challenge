apiVersion: v1
kind: ConfigMap
metadata:
  name: projecthub-config
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/part-of: projecthub
data:
  GIN_MODE: release
  PORT: "8080"
  MONGO_DB: projecthub
  MONGO_CONNECT_TIMEOUT: 60s
  CACHE_ENABLED: "true"
  VALKEY_ADDR: valkey:6379
  VALKEY_DB: "0"
  CACHE_STATS_TTL: 2m
  CACHE_USER_TTL: 1m
  SEED_ENABLED: "true"
