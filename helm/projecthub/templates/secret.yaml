apiVersion: v1
kind: Secret
metadata:
  name: projecthub-secret
  labels:
    {{- include "projecthub.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  MONGO_ROOT_USERNAME: {{ .Values.secrets.mongoRootUsername | quote }}
  MONGO_ROOT_PASSWORD: {{ required "secrets.mongoRootPassword is required" .Values.secrets.mongoRootPassword | quote }}
  MONGO_URI: {{ include "projecthub.mongoUri" . | quote }}
  VALKEY_PASSWORD: {{ required "secrets.valkeyPassword is required" .Values.secrets.valkeyPassword | quote }}
