{{- if .Values.gateway.enabled }}
{{- $c := dict "root" . "component" "gateway" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: projecthub-gateway
  labels:
    {{- include "projecthub.componentLabels" $c | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listenerPort }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: projecthub
  labels:
    {{- include "projecthub.componentLabels" $c | nindent 4 }}
spec:
  parentRefs:
    - name: projecthub-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
{{- end }}
