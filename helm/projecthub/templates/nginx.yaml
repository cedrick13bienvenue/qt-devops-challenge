{{- $c := dict "root" . "component" "nginx" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    {{- include "projecthub.componentLabels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      {{- include "projecthub.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "projecthub.componentLabels" $c | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "projecthub.selectorLabels" $c | nindent 14 }}
      containers:
        - name: nginx
          image: {{ .Values.nginx.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    {{- include "projecthub.componentLabels" $c | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "projecthub.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.nginx.nodePort }}
