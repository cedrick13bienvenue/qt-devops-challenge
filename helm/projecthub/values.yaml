image:
  registry: cedrick13bienvenue
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  ginMode: release
  mongoDb: projecthub
  mongoConnectTimeout: 60s
  cacheEnabled: true
  cacheStatsTtl: 2m
  cacheUserTtl: 1m
  seedEnabled: true

secrets:
  jwtSecret: ""
  mongoRootUsername: projecthub
  mongoRootPassword: ""
  valkeyPassword: ""

api:
  replicas: 3
  goMemLimit: 200MiB
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  replicas: 2
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

nginx:
  image: nginx:1.28-alpine
  replicas: 2
  nodePort: 30080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

mongodb:
  image: mongo:7
  wiredTigerCacheSizeGB: "0.25"
  storage:
    size: 5Gi
    hostPath: /var/lib/projecthub/mongodb
    node: c3-k8s-worker-1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

valkey:
  image: valkey/valkey:8-alpine
  maxMemory: 128mb
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
